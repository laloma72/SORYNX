<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SORYNX | Próximamente</title>

  <meta
    name="description"
    content="SORYNX — En desarrollo. Muy pronto."
  >

  <link rel="icon" type="image/png" href="/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #050505;
      color: #ffffff;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    /* =========================
       PÁGINA
    ========================= */

    .page {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,0.055),
          transparent 38%
        ),
        #050505;
    }

    /* =========================
       LÍNEAS
    ========================= */

    .line {
      position: absolute;
      pointer-events: none;

      background: rgba(255,255,255,0.08);
    }

    .line-horizontal {
      width: 100%;
      height: 1px;

      top: 50%;
      left: 0;
    }

    .line-vertical {
      width: 1px;
      height: 100%;

      top: 0;
      left: 50%;
    }

    /* =========================
       CÍRCULO
    ========================= */

    .orb {
      position: absolute;

      width: min(420px, 80vw);
      height: min(420px, 80vw);

      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;

      animation: pulse 5s ease-in-out infinite;
    }

    .orb::before {
      content: "";

      position: absolute;

      inset: 8%;

      border: 1px solid rgba(255,255,255,0.045);
      border-radius: 50%;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }

    }

    /* =========================
       CONTENIDO
    ========================= */

    .content {
      position: relative;
      z-index: 2;

      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 40px 20px 90px;
    }

    /* =========================
       SORYNX
    ========================= */

    .brand {
      font-family: "Unbounded", sans-serif;

      font-size: clamp(22px, 4vw, 42px);

      font-weight: 900;

      letter-spacing: 0.08em;

      margin-bottom: 60px;

      animation: fadeDown 1s ease forwards;
    }

    /* =========================
       ESTADO
    ========================= */

    .status {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-bottom: 25px;

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.55);

      animation: fadeUp 1s 0.2s ease both;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #ffffff;

      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 1;
      }

    }

    /* =========================
       TÍTULO
    ========================= */

    .title {
      display: flex;
      flex-direction: column;
      align-items: center;

      width: 100%;

      font-family: "Unbounded", sans-serif;

      font-weight: 900;

      text-transform: uppercase;

      text-align: center;

      /*
        CLAVE:
        el tamaño se adapta al ancho
        de la pantalla.
      */
      font-size: min(8vw, 100px);

      line-height: 1;

      letter-spacing: -0.07em;

      white-space: nowrap;

      animation: fadeUp 1s 0.35s ease both;
    }

    .title span {
      display: block;

      width: max-content;
      max-width: 100%;

      white-space: nowrap;
    }

    .title .outline {
      margin-top: 14px;

      color: transparent;

      -webkit-text-stroke: 1px rgba(255,255,255,0.8);
    }

    /* =========================
       SUBTÍTULO
    ========================= */

    .subtitle {
      width: 100%;
      max-width: 520px;

      margin-top: 35px;

      color: rgba(255,255,255,0.5);

      font-size: 12px;

      line-height: 1.8;

      letter-spacing: 0.04em;

      text-align: center;

      animation: fadeUp 1s 0.5s ease both;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      position: absolute;

      left: 0;
      bottom: 25px;

      width: 100%;

      padding: 0 20px;

      text-align: center;

      font-size: 9px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.25);

      animation: fadeUp 1s 0.7s ease both;
    }

    /* =========================
       ANIMACIONES
    ========================= */

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes fadeDown {

      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* =========================
       MÓVIL
    ========================= */

    @media (max-width: 600px) {

      .content {
        padding: 30px 8px 80px;
      }

      .brand {
        font-size: 22px;
        margin-bottom: 45px;
      }

      .status {
        font-size: 8px;
        letter-spacing: 0.16em;
        margin-bottom: 22px;
      }

      /*
        PRÓXIMAMENTE ocupa prácticamente
        todo el ancho disponible.
      */
      .title {
        font-size: 7.2vw;

        letter-spacing: -0.075em;

        line-height: 1;
      }

      .title span {
        white-space: nowrap;
      }

      .title .outline {
        margin-top: 9px;
      }

      .subtitle {
        max-width: 330px;

        margin-top: 28px;

        font-size: 10px;

        line-height: 1.7;
      }

      .orb {
        width: 280px;
        height: 280px;
      }

      .footer {
        bottom: 18px;

        font-size: 7px;

        letter-spacing: 0.14em;
      }

    }

    /* =========================
       MÓVILES PEQUEÑOS
    ========================= */

    @media (max-width: 380px) {

      .content {
        padding-left: 5px;
        padding-right: 5px;
      }

      .brand {
        font-size: 20px;
        margin-bottom: 38px;
      }

      .status {
        font-size: 7px;
      }

      .title {
        font-size: 6.8vw;
        letter-spacing: -0.075em;
      }

      .subtitle {
        max-width: 290px;
        font-size: 9px;
      }

      .orb {
        width: 230px;
        height: 230px;
      }

      .footer {
        font-size: 6px;
      }

    }

    /* =========================
       PANTALLAS BAJAS
    ========================= */

    @media (max-height: 650px) {

      .content {
        padding-top: 20px;
        padding-bottom: 65px;
      }

      .brand {
        margin-bottom: 25px;
      }

      .status {
        margin-bottom: 15px;
      }

      .subtitle {
        margin-top: 20px;
      }

      .footer {
        bottom: 12px;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <div class="line line-horizontal"></div>
    <div class="line line-vertical"></div>

    <div class="orb"></div>

    <div class="content">

      <div class="brand">
        SORYNX
      </div>

      <div class="status">
        <span class="status-dot"></span>
        EN DESARROLLO
      </div>

      <h1 class="title">
        <span>PRÓXIMAMENTE</span>
        <span class="outline">SORYNX</span>
      </h1>

      <p class="subtitle">
        Estamos construyendo algo diferente.
        El universo SORYNX estará disponible muy pronto.
      </p>

    </div>

    <div class="footer">
      DEFINE YOUR PRESENCE.
    </div>

  </main>

</body>
</html>
