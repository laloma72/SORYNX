<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SORYNX | Próximamente</title>

  <meta
    name="description"
    content="SORYNX — En desarrollo. Muy pronto."
  >

  <link rel="icon" type="image/png" href="/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 255, 255, 0.055),
          transparent 35%
        ),
        #050505;
    }

    /* Líneas decorativas */

    .line {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .line-horizontal {
      width: 100%;
      height: 1px;
      top: 50%;
      left: 0;
    }

    .line-vertical {
      width: 1px;
      height: 100%;
      top: 0;
      left: 50%;
    }

    /* Círculo */

    .orb {
      position: absolute;

      width: min(420px, 80vw);
      height: min(420px, 80vw);

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;

      animation: pulse 5s ease-in-out infinite;
    }

    .orb::before {
      content: "";

      position: absolute;
      inset: 8%;

      border: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: 50%;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    /* Contenido */

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 1100px;

      padding: 40px 24px 90px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    /* Logo */

    .brand {
      font-family: "Unbounded", sans-serif;

      font-size: clamp(22px, 4vw, 42px);
      font-weight: 900;

      letter-spacing: 0.08em;

      margin-bottom: clamp(45px, 8vh, 75px);

      animation: fadeDown 1s ease forwards;
    }

    /* Estado */

    .status {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-bottom: 25px;

      font-size: clamp(9px, 1.2vw, 11px);
      font-weight: 500;

      letter-spacing: 0.22em;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.55);

      animation: fadeUp 1s 0.2s ease both;
    }

    .status-dot {
      flex: 0 0 auto;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #fff;

      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 1;
      }
    }

    /* Título */

    .title {
      width: 100%;
      max-width: 100%;

      font-family: "Unbounded", sans-serif;

      /*
        El tamaño se adapta automáticamente
        para que PRÓXIMAMENTE quepa entero.
      */
      font-size: clamp(18px, 7vw, 100px);

      line-height: 1.05;
      font-weight: 900;

      letter-spacing: -0.06em;

      text-transform: uppercase;
      text-align: center;

      /*
        IMPORTANTE:
        evita que la E salte a otra línea.
      */
      white-space: nowrap;

      animation: fadeUp 1s 0.35s ease both;
    }

    .title span {
      display: block;
      width: 100%;
      white-space: nowrap;
    }

    .title .outline {
      color: transparent;

      -webkit-text-stroke:
        clamp(0.7px, 0.12vw, 1.2px)
        rgba(255, 255, 255, 0.8);

      margin-top: 12px;
    }

    /* Subtítulo */

    .subtitle {
      width: 100%;
      max-width: 520px;

      margin: 35px auto 0;

      color: rgba(255, 255, 255, 0.5);

      font-size: clamp(11px, 1.5vw, 13px);

      line-height: 1.8;

      letter-spacing: 0.04em;

      text-align: center;

      animation: fadeUp 1s 0.5s ease both;
    }

    /* Footer */

    .footer {
      position: absolute;

      bottom: 25px;
      left: 0;

      width: 100%;

      padding: 0 20px;

      text-align: center;

      font-size: 9px;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.25);

      animation: fadeUp 1s 0.7s ease both;
    }

    /* Animaciones */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MÓVIL */

    @media (max-width: 600px) {

      .content {
        padding: 30px 12px 80px;
      }

      .brand {
        margin-bottom: 45px;
      }

      .status {
        margin-bottom: 22px;
        letter-spacing: 0.16em;
      }

      .title {
        /*
          Más pequeño en móvil para garantizar
          que PRÓXIMAMENTE quepa entero.
        */
        font-size: clamp(16px, 8vw, 52px);

        letter-spacing: -0.065em;

        line-height: 1.08;

        white-space: nowrap;
      }

      .title span {
        white-space: nowrap;
      }

      .title .outline {
        margin-top: 8px;
      }

      .subtitle {
        max-width: 330px;

        margin-top: 28px;

        font-size: 11px;

        line-height: 1.7;
      }

      .orb {
        width: 280px;
        height: 280px;
      }

      .footer {
        bottom: 18px;

        font-size: 7px;

        letter-spacing: 0.14em;
      }
    }

    /* MÓVILES MUY PEQUEÑOS */

    @media (max-width: 380px) {

      .content {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand {
        font-size: 20px;
        margin-bottom: 38px;
      }

      .status {
        font-size: 8px;
      }

      .title {
        /*
          Tamaño reducido para pantallas
          especialmente estrechas.
        */
        font-size: 16px;

        letter-spacing: -0.06em;
      }

      .subtitle {
        font-size: 10px;
        max-width: 290px;
      }

      .orb {
        width: 230px;
        height: 230px;
      }

      .footer {
        font-size: 6px;
      }
    }

    /* Pantallas con poca altura */

    @media (max-height: 650px) {

      .content {
        padding-top: 20px;
        padding-bottom: 65px;
      }

      .brand {
        margin-bottom: 25px;
      }

      .status {
        margin-bottom: 15px;
      }

      .subtitle {
        margin-top: 20px;
      }

      .footer {
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="line line-horizontal"></div>
    <div class="line line-vertical"></div>

    <div class="orb"></div>

    <div class="content">

      <div class="brand">
        SORYNX
      </div>

      <div class="status">
        <span class="status-dot"></span>
        EN DESARROLLO
      </div>

      <h1 class="title">
        <span>PRÓXIMAMENTE</span>
        <span class="outline">SORYNX</span>
      </h1>

      <p class="subtitle">
        Estamos construyendo algo diferente.
        El universo SORYNX estará disponible muy pronto.
      </p>

    </div>

    <div class="footer">
      DEFINE YOUR PRESENCE.
    </div>

  </main>

</body>
</html>
