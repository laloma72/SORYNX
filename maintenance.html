<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SORYNX | Próximamente</title>

  <meta
    name="description"
    content="SORYNX — En desarrollo. Muy pronto."
  >

  <link rel="icon" type="image/png" href="img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #050505;
      color: #ffffff;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    /* ===== FONDO ===== */

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,0.055),
          transparent 35%
        ),
        #050505;
    }

    /* Líneas decorativas */

    .line {
      position: absolute;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .line-horizontal {
      width: 100%;
      height: 1px;
      top: 50%;
      left: 0;
    }

    .line-vertical {
      width: 1px;
      height: 100%;
      top: 0;
      left: 50%;
    }

    /* Círculos */

    .orb {
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      animation: pulse 5s ease-in-out infinite;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: 35px;
      border: 1px solid rgba(255,255,255,0.045);
      border-radius: 50%;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    /* ===== CONTENIDO ===== */

    .content {
      position: relative;
      z-index: 2;
      width: min(900px, 90%);
      text-align: center;
      padding: 40px 20px;
    }

    .brand {
      font-family: "Unbounded", sans-serif;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 70px;
      animation: fadeDown 1s ease forwards;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      animation: fadeUp 1s 0.2s ease both;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 1;
      }
    }

    .title {
      font-family: "Unbounded", sans-serif;
      font-size: clamp(44px, 9vw, 110px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      animation: fadeUp 1s 0.35s ease both;
    }

    .title span {
      display: block;
    }

    .title .outline {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.8);
      margin-top: 10px;
    }

    .subtitle {
      max-width: 520px;
      margin: 40px auto 0;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      line-height: 1.8;
      letter-spacing: 0.04em;
      animation: fadeUp 1s 0.5s ease both;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      white-space: nowrap;
    }

    /* ===== ANIMACIONES ===== */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== MÓVIL ===== */

    @media (max-width: 600px) {

      .orb {
        width: 280px;
        height: 280px;
      }

      .orb::before {
        inset: 25px;
      }

      .brand {
        margin-bottom: 55px;
      }

      .subtitle {
        font-size: 12px;
        padding: 0 10px;
      }

      .footer {
        font-size: 8px;
        bottom: 20px;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <div class="line line-horizontal"></div>
    <div class="line line-vertical"></div>

    <div class="orb"></div>

    <div class="content">

      <div class="brand">
        SORYNX
      </div>

      <div class="status">
        <span class="status-dot"></span>
        EN DESARROLLO
      </div>

      <h1 class="title">
        <span>PRÓXIMAMENTE</span>
        <span class="outline">SORYNX</span>
      </h1>

      <p class="subtitle">
        Estamos construyendo algo diferente.
        El universo SORYNX estará disponible muy pronto.
      </p>

    </div>

    <div class="footer">
      DEFINE YOUR PRESENCE.
    </div>

  </main>

</body>
</html>
