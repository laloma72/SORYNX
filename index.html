  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;

      display: grid;
      place-items: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(255,255,255,0.065) 0%,
          rgba(255,255,255,0.025) 18%,
          transparent 43%
        ),
        radial-gradient(
          circle at 50% 50%,
          #101010 0%,
          #050505 65%
        );
    }

    /* =========================
       GRID
    ========================= */

    .grid {
      position: absolute;
      inset: 0;

      opacity: 0.16;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        transparent 72%
      );

      -webkit-mask-image: radial-gradient(
        ellipse at center,
        black 0%,
        transparent 72%
      );
    }

    /* =========================
       CENTER LINES
    ========================= */

    .line {
      position: absolute;
      pointer-events: none;

      background: rgba(255,255,255,0.09);
    }

    .line-horizontal {
      width: 100%;
      height: 1px;

      top: 50%;
      left: 0;
    }

    .line-vertical {
      width: 1px;
      height: 100%;

      left: 50%;
      top: 0;
    }

    /* =========================
       ORB
    ========================= */

    .orb {
      position: absolute;

      width: min(560px, 85vw);
      height: min(560px, 85vw);

      border: 1px solid rgba(255,255,255,0.075);

      border-radius: 50%;

      animation: orbPulse 7s ease-in-out infinite;
    }

    .orb::before {
      content: "";

      position: absolute;
      inset: 9%;

      border: 1px solid rgba(255,255,255,0.045);

      border-radius: 50%;
    }

    .orb::after {
      content: "";

      position: absolute;
      inset: 20%;

      border: 1px solid rgba(255,255,255,0.035);

      border-radius: 50%;
    }

    @keyframes orbPulse {

      0%,
      100% {
        transform: scale(0.94);
        opacity: 0.45;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }

    }

    /* =========================
       CORNER MARKS
    ========================= */

    .corner {
      position: absolute;

      width: 28px;
      height: 28px;

      opacity: 0.35;
    }

    .corner::before,
    .corner::after {
      content: "";

      position: absolute;

      background: #fff;
    }

    .corner::before {
      width: 28px;
      height: 1px;
    }

    .corner::after {
      width: 1px;
      height: 28px;
    }

    .corner-tl {
      top: 28px;
      left: 28px;
    }

    .corner-tr {
      top: 28px;
      right: 28px;
      transform: rotate(90deg);
    }

    .corner-bl {
      bottom: 28px;
      left: 28px;
      transform: rotate(-90deg);
    }

    .corner-br {
      bottom: 28px;
      right: 28px;
      transform: rotate(180deg);
    }

    /* =========================
       TOP LABEL
    ========================= */

    .top-label {
      position: absolute;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      font-size: 8px;

      letter-spacing: 0.35em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.25);

      white-space: nowrap;
    }

    /* =========================
       MAIN CONTENT
    ========================= */

    .content {
      position: relative;

      z-index: 5;

      width: 100%;

      padding: 20px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      font-family: "Unbounded", sans-serif;

      font-size: clamp(24px, 4vw, 43px);

      font-weight: 900;

      letter-spacing: 0.08em;

      margin-bottom: 48px;

      animation: fadeDown 1s ease both;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      margin-bottom: 26px;

      font-size: 9px;

      font-weight: 500;

      letter-spacing: 0.28em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.48);

      animation: fadeUp 1s 0.2s ease both;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 12px rgba(255,255,255,0.6);

      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }

    }

    /* =========================
       TITLE
    ========================= */

    .title {
      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      font-family: "Unbounded", sans-serif;

      font-size: clamp(
        24px,
        7vw,
        105px
      );

      font-weight: 900;

      line-height: 0.98;

      letter-spacing: -0.075em;

      text-transform: uppercase;

      white-space: nowrap;

      animation: titleIn 1.2s 0.3s cubic-bezier(.16,1,.3,1) both;
    }

    .title span {
      display: block;

      width: max-content;

      max-width: 100%;

      text-align: center;

      white-space: nowrap;
    }

    .title .outline {
      margin-top: 15px;

      color: transparent;

      -webkit-text-stroke:
        1px rgba(255,255,255,0.78);

      text-shadow:
        0 0 30px rgba(255,255,255,0.03);
    }

    @keyframes titleIn {

      from {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }

    /* =========================
       SUBTITLE
    ========================= */

    .subtitle {
      width: 100%;

      max-width: 520px;

      margin: 34px auto 0;

      font-size: 11px;

      line-height: 1.8;

      letter-spacing: 0.05em;

      color: rgba(255,255,255,0.42);

      text-align: center;

      animation: fadeUp 1s 0.55s ease both;
    }

    /* =========================
       SIDE INFO
    ========================= */

    .side {
      position: absolute;

      z-index: 3;

      top: 50%;

      font-size: 7px;

      letter-spacing: 0.25em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.2);

      writing-mode: vertical-rl;
    }

    .side-left {
      left: 28px;

      transform:
        translateY(-50%)
        rotate(180deg);
    }

    .side-right {
      right: 28px;

      transform:
        translateY(-50%);
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      position: absolute;

      z-index: 5;

      bottom: 27px;

      left: 0;

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 18px;

      font-size: 8px;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.22);

      animation: fadeUp 1s 0.8s ease both;
    }

    .footer-line {
      width: 35px;
      height: 1px;

      background: rgba(255,255,255,0.18);
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes fadeDown {

      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .grid {
        background-size: 45px 45px;
      }

      .orb {
        width: 330px;
        height: 330px;
      }

      .corner {
        width: 20px;
        height: 20px;
      }

      .corner::before {
        width: 20px;
      }

      .corner::after {
        height: 20px;
      }

      .corner-tl,
      .corner-tr {
        top: 20px;
      }

      .corner-bl,
      .corner-br {
        bottom: 20px;
      }

      .corner-tl,
      .corner-bl {
        left: 20px;
      }

      .corner-tr,
      .corner-br {
        right: 20px;
      }

      .top-label {
        top: 22px;
        font-size: 6px;
      }

      .brand {
        font-size: 22px;
        margin-bottom: 38px;
      }

      .status {
        font-size: 7px;
        letter-spacing: 0.18em;
        margin-bottom: 20px;
      }

      .title {
        font-size: 7vw;
        letter-spacing: -0.075em;
      }

      .title .outline {
        margin-top: 10px;
      }

      .subtitle {
        max-width: 310px;
        margin-top: 27px;
        font-size: 9px;
      }

      .side {
        display: none;
      }

      .footer {
        bottom: 20px;
        font-size: 6px;
        gap: 10px;
      }

      .footer-line {
        width: 20px;
      }
    }

    /* =========================
       VERY SMALL SCREENS
    ========================= */

    @media (max-width: 380px) {

      .brand {
        font-size: 19px;
        margin-bottom: 32px;
      }

      .status {
        font-size: 6px;
      }

      .title {
        font-size: 6.5vw;
      }

      .subtitle {
        max-width: 275px;
        font-size: 8px;
      }

      .orb {
        width: 250px;
        height: 250px;
      }

      .footer {
        font-size: 5px;
      }
    }

    /* =========================
       SHORT SCREENS
    ========================= */

    @media (max-height: 650px) {

      .brand {
        margin-bottom: 22px;
      }

      .status {
        margin-bottom: 14px;
      }

      .subtitle {
        margin-top: 18px;
      }

      .footer {
        bottom: 12px;
      }

      .top-label {
        top: 15px;
      }

      .orb {
        width: 330px;
        height: 330px;
      }
    }

  </style>
