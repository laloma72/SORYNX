<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SORYNX | Próximamente</title>

  <link rel="icon" type="image/png" href="/img/logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      position: relative;
    }

    .content {
      width: 100%;
      padding: 20px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .brand {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 50px;
    }

    .status {
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 25px;
      opacity: 0.5;
    }

    .title {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      font-size: clamp(24px, 7vw, 100px);
      font-weight: 900;
      line-height: 1;

      letter-spacing: -4px;

      white-space: nowrap;
    }

    .title span {
      display: block;
      width: max-content;
    }

    .outline {
      margin-top: 15px;
      color: transparent;
      -webkit-text-stroke: 1px white;
    }

    .subtitle {
      margin-top: 35px;

      max-width: 500px;

      font-size: 12px;
      line-height: 1.7;

      opacity: 0.45;

      text-align: center;
    }

    .footer {
      position: absolute;
      bottom: 25px;
      left: 0;

      width: 100%;

      text-align: center;

      font-size: 9px;
      letter-spacing: 3px;
      opacity: 0.25;
    }

    @media (max-width: 600px) {

      .brand {
        font-size: 22px;
        margin-bottom: 40px;
      }

      .status {
        font-size: 8px;
        letter-spacing: 2px;
      }

      .title {
        font-size: 7vw;
        letter-spacing: -2px;
      }

      .subtitle {
        max-width: 320px;
        font-size: 10px;
      }

    }
  </style>
</head>

<body>

  <main class="page">

    <div class="content">

      <div class="brand">
        SORYNX
      </div>

      <div class="status">
        EN DESARROLLO
      </div>

      <h1 class="title">
        <span>PRÓXIMAMENTE</span>
        <span class="outline">SORYNX</span>
      </h1>

      <p class="subtitle">
        Estamos construyendo algo diferente.
        El universo SORYNX estará disponible muy pronto.
      </p>

    </div>

    <div class="footer">
      DEFINE YOUR PRESENCE.
    </div>

  </main>

</body>
</html>
